name: Release Plugin

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: 校验
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax check
        run: python -m py_compile main.py

      - name: Validate plugin files
        run: python scripts/build.py --check

      - name: Smoke test
        run: python tests/smoke_test.py

  release:
    name: 打包发布
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build zip
        run: python scripts/build.py

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/astrbot_plugin_session_switch.zip
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
